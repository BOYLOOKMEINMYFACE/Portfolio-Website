<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CSS Animation Example</title>
  <style>
    .rect {
      width: 100px;
      height: 100px;
      background: #8f95a7;
      margin: 50px auto;
      animation: bounce 2s infinite; /* use keyframes below */
    }

    @keyframes bounce {
      0%   { transform: translateY(0); }
      50%  { transform: translateY(-50px); }
      100% { transform: translateY(0); }
    }

    .rect:hover {
      background: #ff6f61;
      transition: background 0.5s ease;
    }
  </style>
</head>
<body>
  <div class="rect"></div>
</body>
</html>
