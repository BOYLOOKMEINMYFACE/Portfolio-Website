<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, width=device-width">
  <title>Jacob Zhao Portfolio</title>

  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;700&display=swap" rel="stylesheet">

</head>


<body>
  <div class="home-page">
    <div class="home-page-Rectangle" style="background-color: #8f95a7;">
      <h1> Jacob Zhao </h1>
    </div>
    <div class="home-page-Rectangle" style="background-color: #767C88;">
      <h1> About Me </h1>
      <img style="left: 0%; bottom: 0%; width: 100%; height: auto;
      position: absolute; mix-blend-mode: multiply;" src="About Me Cover.png" />
    </div>
    <div class="home-page-Rectangle" style="background-color: #686D75;">
      <h1> ArchFolio </h1>
      <img style="left: 0%; bottom: 0%; width: 100%; height: auto;
      position: absolute; object-fit: cover;" src="ArchFolio Cover.png" />
    </div>
    <div class="home-page-Rectangle" style="background-color: #53585B;">
      <h1> Coding Projects </h1>
      <img style="left: 0%; bottom: 0%; width: 100%; height: auto;
      position: absolute; mix-blend-mode: luminosity;" src="Code Project Cover.png" />
    </div>
    <div class="home-page-Rectangle" style="background-color: #444947;">
      <h1> ArtWorks </h1>
      <img style="width: auto; height: 80%; 
      left: 50%; transform: translateX(-50%); bottom: 0%; 
      position: absolute; mix-blend-mode: multiply" src="Pencil Self Portrait-Transparent.png" />
    </div>
    <div class="home-page-Rectangle" style="background-color: #31352F;">
      <h1> My Mission </h1>
      <img style="width: 100%; height: auto; 
      left: 0%; bottom: 0%; 
      position: absolute; mix-blend-mode: difference" src="My Mission Cover.png" />
    </div>
    <a href="https://www.linkedin.com/in/jacob-zhao-architect/" target="_blank">
      <img src="TONG-logo.png" alt="logo" class="logo" style="bottom: 20px; right: 20px; z-index: 100;">
    </a>
  </div>
</body>

</html>
