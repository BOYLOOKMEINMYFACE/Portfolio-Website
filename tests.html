<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jacob Zhao Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: 'Jost', sans-serif;
      background: #f5f5f5;
    }

    h1 {
      font-size: 16px;
      font-weight: 400;
      margin: 20px;
    }

    .container {
      position: relative;
      width: 100%;
      height: 90vh;
      background: radial-gradient(circle at top left, #e5ffbd, #d9c7a6, #d8fdd1);
      overflow: hidden;
    }

    .circle {
      position: absolute;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #a5f28d;
      border-radius: 50%;
      color: white;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.3s;
    }

    .circle:hover {
      transform: scale(1.05);
    }

    /* Sizes */
    .biggest { width: 250px; height: 250px; font-size: 22px; }
    .big     { width: 220px; height: 220px; font-size: 20px; }
    .medium  { width: 160px; height: 160px; font-size: 18px; }
    .small   { width: 120px; height: 120px; font-size: 16px; }

    /* Positions (tuned to match your screenshot) */
    .jacob      { top: 60px; left: 100px; }
    .portfolio  { top: 280px; left: 500px; }
    .mission    { top: 40px; left: 500px; }
    .artworks   { top: 100px; left: 780px; }
    .about      { top: 300px; left: 60px; }
    .coding     { top: 320px; left: 300px; }
  </style>
</head>
<body>

  <h1>Home Page</h1>

  <div class="container">
    <div class="circle biggest jacob">Jacob Zhao</div>
    <div class="circle big portfolio">Architecture<br>Portfolio</div>
    <div class="circle medium coding">Coding<br>Projects</div>
    <div class="circle medium mission">My Mission</div>
    <div class="circle small artworks">ArtWorks</div>
    <div class="circle small about">About Me</div>
  </div>

</body>
</html>
