<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Jacob Zhao</title>

  <!-- SPACE GROTESK -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Istok+Web:ital,wght@0,400;0,700;1,400;1,700&family=Space+Grotesk:wght@300..700&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Space Grotesk", sans-serif;
      background: white;
      color: #666;
    }

    /* HEADER */

    header {
      min-height: 82vh;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 40px 20px 40px;
    }

    .logo {
      font-family: "Space Grotesk", sans-serif;

      font-size: clamp(54px, 8vw, 118px);
      font-weight: 300;

      letter-spacing: -0.05em;

      color: black;

      line-height: 0.95;
      text-align: center;
    }

    nav {
      width: 75vw;
      max-width: 1200px;

      margin-top: 70px;

      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr;

      align-items: center;
      gap: 34px;
    }

    nav a {
      font-family: "Space Grotesk", sans-serif;

      text-decoration: none;

      color: #9b9b9b;

      font-size: 19px;
      font-weight: 400;

      text-align: center;

      letter-spacing: -0.03em;
    }

    nav a:hover,
    nav a.active {
      color: black;
    }

    .divider {
      width: 1px;
      height: 42px;
      background: #dddddd;
    }

    /* GALLERY */

    .gallery {
      width: 75vw;
      max-width: 1450px;

      margin: 0 auto 80px;

      display: flex;
      flex-direction: column;

      gap: 20px;
    }

    /* ROWS */

    .row {
      display: flex;
      gap: 20px;
      align-items: stretch;
    }

    /* PROJECTS */

    .project {
      position: relative;
      overflow: hidden;

      background: #f2f2f2;
    }

    .project img {
      width: 100%;
      height: 100%;

      display: block;
      object-fit: cover;
    }

    /* FIXED HEIGHTS */

    .row-large {
      height: 760px;
    }

    .row-medium {
      height: 540px;
    }

    .row-small {
      height: 420px;
    }

    /* FLEX RATIOS */

    .hero {
      flex: 1.12;
    }

    .stack {
      flex: 0.88;

      display: flex;
      flex-direction: column;

      gap: 20px;
    }

    .stack .project {
      flex: 1;
    }

    .wide-left {
      flex: 1.08;
    }

    .wide-right {
      flex: 0.92;
    }

    .thin {
      flex: 0.78;
    }

    .large {
      flex: 1.22;
    }

    .equal {
      flex: 1;
    }

    /* IMAGE TITLE */

    .title {
      font-family: "Space Grotesk", sans-serif;

      position: absolute;

      top: 38px;
      left: 42px;

      color: rgba(255,255,255,0.93);

      font-size: clamp(30px, 3vw, 58px);

      font-weight: 300;

      letter-spacing: -0.05em;

      line-height: 0.95;
    }

    /* MOBILE */

    @media (max-width: 900px) {

      header {
        min-height: 75vh;
        padding: 100px 20px 40px;
      }

      nav {
        width: 90vw;

        grid-template-columns: 1fr;
        gap: 18px;
      }

      .divider {
        display: none;
      }

      .gallery {
        width: 90vw;
      }

      .row {
        flex-direction: column;
        height: auto !important;
      }

      .project {
        height: auto;
      }

      .project img {
        aspect-ratio: 4 / 3;
      }

      .title {
        left: 24px;
        top: 24px;
      }
    }

  </style>
</head>

<body>

  <header>

    <div class="logo">
      Jacob Zhao
    </div>

    <nav>

      <a href="#" class="active">
        Selected Works
      </a>

      <div class="divider"></div>

      <a href="#">
        About
      </a>

      <div class="divider"></div>

      <a href="#">
        Contact
      </a>

    </nav>

  </header>

  <main class="gallery">

    <!-- ROW 1 -->

    <section class="row row-large">

      <article class="project hero">

        <img
          src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1800"
          alt=""
        >

        <div class="title">
          Oblique Garden
        </div>

      </article>

      <div class="stack">

        <article class="project">

          <img
            src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=1400"
            alt=""
          >

        </article>

        <article class="project">

          <img
            src="https://images.unsplash.com/photo-1494526585095-c41746248156?w=1400"
            alt=""
          >

        </article>

      </div>

    </section>

    <!-- ROW 2 -->

    <section class="row row-medium">

      <article class="project wide-left">

        <img
          src="https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?w=1600"
          alt=""
        >

      </article>

      <article class="project wide-right">

        <img
          src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=1600"
          alt=""
        >

      </article>

    </section>

  </main>

</body>
</html>
